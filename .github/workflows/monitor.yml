name: Weekly Convertible Bond and Stock Scan

on:
  schedule:
    # 每周二 9:40 北京时间 = UTC 01:40
    - cron: '40 1 * * 2'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Test midterm strategy
        run: python -m unittest discover -s tests -v

      - run: python -m src.monitor_main
        env:
          FORCE_RUN: ${{ github.event_name != 'schedule' }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
