# Strategy 1: price is strictly below 100 and maturity is within 1.5 years.
low_price:
  enabled: true
  max_bond_price: 100
  max_years_to_expire: 1.5
  max_results: 20

# Strategy 2: four completed weeks of stock-vs-SW-sector relative strength.
midterm:
  enabled: true
  weeks: 4
  max_sector_gain_pct: 5
  min_excess_return_pct: 8
  min_weekly_excess_pct: 0
  require_every_week_outperform: true
  max_results: 20
  history_calendar_days: 100
  max_workers: 4
  min_coverage_ratio: 0.8

market:
  sector_map_path: data/cb_stock_sectors.json
  refresh_unknown_sectors: true

notification:
  dingtalk:
    enabled: true
    webhook_env: DINGTALK_WEBHOOK
    secret_env: DINGTALK_SECRET

# Upstream names can occasionally be stale; only presentation names are overridden.
name_overrides:
  "123072":
    - "乐歌转债"
    - "乐歌股份"
